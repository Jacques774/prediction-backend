<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Setup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1220;
      color: #e5e7eb;
      margin: 0;
      padding: 16px;
    }
    .setup-container { max-width: 600px; margin: 0 auto; padding-top: 20px; }
    .setup-title { text-align: center; font-size: 1.6rem; font-weight: 700; margin-bottom: 20px; }
    .setup-card { background: #111827; border-radius: 14px; padding: 22px; border: 1px solid #1f2937; display: flex; flex-direction: column; gap: 16px; }
    .setup-card label { font-size: 0.95rem; font-weight: 600; color: #cbd5e1; }
    .setup-card input, .setup-card select { padding: 12px; border-radius: 10px; border: 1px solid #1f2937; background: #0f172a; color: #e5e7eb; font-size: 1rem; }
    #create-game-btn { padding: 14px; border-radius: 12px; border: none; background: #22c55e; color: #052e16; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    #create-game-btn:hover { background: #16a34a; }
    .readonly-field { padding: 12px; border-radius: 10px; background: #1f2937; color: #e5e7eb; font-size: 1rem; border: 1px solid #374151; word-break: break-all; }
    .code-box { font-size: 1.5rem; font-weight: 800; letter-spacing: 3px; text-align: center; color: #38bdf8; background: #0f172a; border: 2px dashed #38bdf8; padding: 14px; border-radius: 12px; }
    .share-btn { padding: 12px; border-radius: 10px; border: none; background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer; margin-top: 10px; width: 100%; }
    #start-game-btn { padding: 14px; border-radius: 12px; border: none; background: #3b82f6; color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="setup-container">
    <h1 class="setup-title">Game Setup</h1>
    <div class="setup-card">
      <label>Sport Type</label>
      <select id="sport-type">
        <option value="">Select sport</option>
        <option value="football">Football</option>
        <option value="rugby" selected>Rugby</option>
        <option value="basketball">Basketball</option>
        <option value="tennis">Tennis</option>
      </select>

      <label>Starting Balance (£)</label>
      <input type="number" id="starting-balance" min="20" value="100" placeholder="100">

      <label>How Many Questions</label>
      <input type="number" id="question-count" min="1" value="40" placeholder="40">

      <label>Question Time (minutes)</label>
      <input type="number" id="question-time" min="1" value="2" placeholder="2">

      <div id="setupError" style="color:#ef4444; font-weight:600; display:none; font-size:0.9rem;"></div>
      
      <button id="create-game-btn">Create Game</button>
      
      <div id="generatedLinkBox" style="display:none; margin-top:20px; display:flex; flex-direction:column; gap:12px;">
        <label>Players Join Link</label>
        <div class="readonly-field" id="generated-link"></div>
        <button id="share-btn" class="share-btn">Share Link</button>

        <label style="margin-top: 8px;">Game Room Code</label>
        <div class="code-box" id="game-code-display"></div>
      </div>

      <button id="start-game-btn">Start Game as Host</button>
    </div>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const createBtn = document.getElementById("create-game-btn");
    const err = document.getElementById("setupError");
    const linkBox = document.getElementById("generatedLinkBox");
    const linkField = document.getElementById("generated-link");
    const codeDisplay = document.getElementById("game-code-display");
    const shareBtn = document.getElementById("share-btn");
    const startBtn = document.getElementById("start-game-btn");

    const API_BASE = "https://prediction-backend-2e20.onrender.com/api";
    const BASE_URL = "https://prediction-backend-2e20.onrender.com";

    createBtn.addEventListener("click", () => {
      const sport = document.getElementById("sport-type").value;
      const startingBalance = Number(document.getElementById("starting-balance").value);
      const questionCount = Number(document.getElementById("question-count").value);
      const questionTimeMins = Number(document.getElementById("question-time").value);

      if (!sport || startingBalance < 20 || questionCount <= 0 || questionTimeMins < 1) {
        err.textContent = "Please fill in all fields correctly (Min balance: £20, Min card timer: 1 min).";
        err.style.display = "block";
        return;
      }
      err.style.display = "none";

      // Convert minutes to seconds
      const questionTimeSeconds = questionTimeMins * 60;

      // ✅ FIXED: Explicitly send startingBalance, questionCount, and qtime to server
      fetch(`${API_BASE}/create-game`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          hostId: "temp-host",
          startingBalance: startingBalance,
          questionCount: questionCount,
          qtime: questionTimeSeconds
        })
      })
      .then(res => res.json())
      .then(data => {
        const gameCode = data.code;
        const serverTimer = data.qtime; // Server-confirmed timer in seconds

        window.GameSession = { gameCode, sport, startingBalance, questionCount, questionTimeSeconds: serverTimer };

        const joinLink = `${BASE_URL}/player.html?code=${gameCode}&buyin=${startingBalance}&qtime=${serverTimer}`;
        linkField.textContent = joinLink;
        
        codeDisplay.textContent = gameCode;

        linkBox.style.display = "flex";
        startBtn.style.display = "block";

        console.log("Game created on server:", window.GameSession);
      })
      .catch(err => {
        console.error("Error creating game:", err);
        alert("Failed to create game. Please try again.");
      });
    });

    shareBtn.addEventListener("click", async () => {
      const link = linkField.textContent;
      try {
        await navigator.share({
          title: "Join Prediction Game",
          text: "Join the game now!",
          url: link
        });
      } catch {
        navigator.clipboard.writeText(link);
        alert("Link copied to clipboard");
      }
    });

    // Host redirect
    startBtn.addEventListener("click", () => {
      const { gameCode, startingBalance, questionTimeSeconds } = window.GameSession;
      window.location.href = `${BASE_URL}/host?code=${gameCode}&buyin=${startingBalance}&qtime=${questionTimeSeconds}`;
    });
  });
</script>
</body>
</html>
