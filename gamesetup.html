<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Setup | Sport Volt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-primary: #050b14;       /* Deep midnight stadium background */
      --bg-card: #0d1726;          /* Lighter navy container */
      --text-main: #ffffff;        /* Crisp white text */
      --text-muted: #94a3b8;       /* Muted grey for labels */
      --accent-blue: #00d2ff;      /* Electric cyan glow accent */
      --border-color: #1e293b;     /* Dark subtle borders */
    }

    html, body {
      font-family: "Segoe UI", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 10px 16px;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }

    .setup-container { 
      width: 100%;
      max-width: 520px; 
      margin: 0 auto; 
      display: flex;
      flex-direction: column;
    }

    .setup-title { 
      text-align: center; 
      font-size: 1.6rem; 
      font-weight: 700; 
      margin: 8px 0 12px 0; 
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .setup-card { 
      background-color: var(--bg-card); 
      border-radius: 14px; 
      padding: 18px 22px; 
      border: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .setup-card label { 
      font-size: 0.85rem; 
      font-weight: 700; 
      color: var(--text-muted); 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setup-card input, .setup-card select { 
      padding: 11px 14px; 
      border-radius: 10px; 
      border: 1px solid var(--border-color); 
      background: #050b14; 
      color: var(--text-main); 
      font-size: 1.05rem; 
      outline: none;
      transition: border-color 0.3s;
    }

    .setup-card input:focus, .setup-card select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.25);
    }

    #create-game-btn { 
      padding: 13px; 
      border-radius: 30px; 
      border: 1px solid var(--accent-blue); 
      background: transparent; 
      color: var(--text-main); 
      font-size: 1.05rem; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 6px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
      transition: all 0.3s ease;
    }
    #create-game-btn:hover { 
      background-color: var(--accent-blue); 
      color: #000;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
    }

    .readonly-field { 
      padding: 10px; 
      border-radius: 10px; 
      background: #050b14; 
      color: var(--accent-blue); 
      font-size: 0.95rem; 
      border: 1px solid var(--border-color); 
      word-break: break-all; 
    }

    .code-box { 
      font-size: 1.7rem; 
      font-weight: 800; 
      letter-spacing: 3px; 
      text-align: center; 
      color: var(--accent-blue); 
      background: #050b14; 
      border: 2px dashed var(--accent-blue); 
      padding: 12px; 
      border-radius: 12px;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    .share-btn { 
      padding: 11px; 
      border-radius: 10px; 
      border: 1px solid var(--accent-blue); 
      background: rgba(0, 210, 255, 0.1); 
      color: var(--accent-blue); 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 2px; 
      width: 100%; 
      transition: all 0.3s;
    }
    .share-btn:hover {
      background: var(--accent-blue);
      color: #000;
    }

    #start-game-btn { 
      padding: 13px; 
      border-radius: 30px; 
      border: none; 
      background: var(--accent-blue); 
      color: #000; 
      font-size: 1.05rem; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 6px; 
      display: none; 
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      transition: all 0.3s;
    }
    #start-game-btn:hover {
      background: #38bdf8;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
    }
  </style>
</head>
<body>
  <div class="setup-container">
    <h1 class="setup-title">Game Setup</h1>
    <div class="setup-card">
      <label>Sport Type</label>
      <select id="sport-type">
        <option value="">Select sport</option>
        <option value="football">Football</option>
        <option value="rugby" selected>Rugby</option>
        <option value="basketball">Basketball</option>
        <option value="tennis">Tennis</option>
      </select>

      <!-- ⚡ NEW: Game Mode Option (Replaces Card Timer Input) -->
      <label>Game Mode</label>
      <select id="game-mode">
        <option value="blitz" selected>Blitz (Fast Events: 90s - 3m)</option>
        <option value="tactical">Tactical (Macro Trends: 4m - 10m)</option>
        <option value="mix">Mix (Combined Blitz & Tactical Deck)</option>
      </select>

      <label>Starting Balance (⚡)</label>
      <input type="number" id="starting-balance" min="20" value="50" placeholder="50">

      <label>How Many Questions (Max 20)</label>
      <input type="number" id="question-count" min="1" max="20" value="20" placeholder="20">

      <div id="setupError" style="color:#ef4444; font-weight:600; display:none; font-size:0.9rem;"></div>
      
      <button id="create-game-btn">Create Game</button>
      
      <div id="generatedLinkBox" style="display:none; margin-top:8px; flex-direction:column; gap:6px;">
        <div style="display: none;">
          <label>Players Join Link</label>
          <div class="readonly-field" id="generated-link"></div>
          <button id="share-btn" class="share-btn">Share Link</button>
        </div>

        <label style="margin-top: 2px;">Game Room Code</label>
        <div class="code-box" id="game-code-display"></div>
      </div>

      <button id="start-game-btn">Start Game as Host</button>
    </div>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const maxCredit = Number(urlParams.get("credit")) || 50;

    const balanceInput = document.getElementById("starting-balance");
    if (balanceInput) {
      balanceInput.max = maxCredit;
      balanceInput.value = maxCredit;
      if (Number(balanceInput.value) > maxCredit) {
        balanceInput.value = maxCredit;
      }
    }

    const createBtn = document.getElementById("create-game-btn");
    const err = document.getElementById("setupError");
    const linkBox = document.getElementById("generatedLinkBox");
    const linkField = document.getElementById("generated-link");
    const codeDisplay = document.getElementById("game-code-display");
    const shareBtn = document.getElementById("share-btn");
    const startBtn = document.getElementById("start-game-btn");

    const API_BASE = "https://prediction-backend-2e20.onrender.com/api";
    const BASE_URL = "https://prediction-backend-2e20.onrender.com";

    createBtn.addEventListener("click", () => {
      const sport = document.getElementById("sport-type").value;
      const gameMode = document.getElementById("game-mode").value; // 'blitz', 'tactical', or 'mix'
      const startingBalance = Number(balanceInput.value);
      const questionCount = Number(document.getElementById("question-count").value);

      if (startingBalance > maxCredit) {
        err.textContent = `Starting balance (${startingBalance}⚡) cannot exceed your available credit (${maxCredit}⚡).`;
        err.style.display = "block";
        return;
      }

      if (questionCount > 20) {
        err.textContent = "Maximum question limit is 20.";
        err.style.display = "block";
        return;
      }

      if (!sport || !gameMode || startingBalance < 20 || questionCount <= 0) {
        err.textContent = "Please fill in all fields correctly (Min balance: 20⚡).";
        err.style.display = "block";
        return;
      }
      err.style.display = "none";

      fetch(`${API_BASE}/create-game`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          hostId: "temp-host",
          sport: sport,
          mode: gameMode,
          startingBalance: startingBalance,
          questionCount: questionCount
        })
      })
      .then(res => res.json())
      .then(data => {
        const gameCode = data.code;

        window.GameSession = { gameCode, sport, gameMode, startingBalance, questionCount };

        const joinLink = `${BASE_URL}/player.html?code=${gameCode}&buyin=${startingBalance}&mode=${gameMode}`;
        linkField.textContent = joinLink;
        
        codeDisplay.textContent = gameCode;

        linkBox.style.display = "flex";
        startBtn.style.display = "block";

        console.log("Game created on server:", window.GameSession);
      })
      .catch(err => {
        console.error("Error creating game:", err);
        alert("Failed to create game. Please try again.");
      });
    });

    shareBtn.addEventListener("click", async () => {
      const link = linkField.textContent;
      try {
        await navigator.share({
          title: "Join Prediction Game",
          text: "Join the game now!",
          url: link
        });
      } catch {
        navigator.clipboard.writeText(link);
        alert("Link copied to clipboard");
      }
    });

    startBtn.addEventListener("click", () => {
      const { gameCode, gameMode, startingBalance } = window.GameSession;
      window.location.href = `${BASE_URL}/host?code=${gameCode}&buyin=${startingBalance}&mode=${gameMode}`;
    });
  });
</script>
</body>
</html>
