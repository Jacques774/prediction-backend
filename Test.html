<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatroom Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; margin-bottom: 10px; }
    #chat-input { width: 70%; padding: 5px; }
    #send-btn { padding: 5px 10px; }
    .msg { margin: 5px 0; }
    .me { font-weight: bold; color: #2563eb; }
    .other { color: #374151; }
    #status { margin-bottom: 10px; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <h2>Chatroom Test</h2>
  <div id="status">Connecting…</div>
  <div id="chat-box"></div>
  <input id="chat-input" placeholder="Type a message…" />
  <button id="send-btn">Send</button>

  <script>
    // Connect to your Render backend
    const socket = io("https://prediction-backend-2e20.onrender.com");

    const statusBox = document.getElementById("status");

    // Show connection status on the page
    socket.on("connect", () => {
      statusBox.textContent = "✅ Connected to backend: " + socket.id;
    });
    socket.on("connect_error", (err) => {
      statusBox.textContent = "❌ Connection failed: " + err.message;
    });

    // Read gameId and playerName from URL
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get("code") || "TESTROOM";
    const playerName = urlParams.get("name") || "Anonymous";

    // Join the room
    socket.emit("join_game", { gameId, playerName, isHost: false });

    // Listen for chat messages
    socket.on("chat_message", ({ playerName: senderName, message }) => {
      const chatBox = document.getElementById("chat-box");
      const msg = document.createElement("div");

      if (senderName === playerName) {
        msg.className = "msg me";
        msg.textContent = `Me: ${message}`;
      } else {
        msg.className = "msg other";
        msg.textContent = `${senderName}: ${message}`;
      }

      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Send chat messages
    document.getElementById("send-btn").addEventListener("click", () => {
      const input = document.getElementById("chat-input");
      const message = input.value.trim();
      if (message) {
        socket.emit("chat_message", { gameId, playerName, message });
        input.value = "";
      }
    });
  </script>
</body>
</html>
