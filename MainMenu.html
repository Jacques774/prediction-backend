<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Menu</title>
  <link rel="stylesheet" href="styles.css"> <!-- optional external CSS -->
  <style>
    body {
      font-family: "Segoe UI", sans-serif; /* swap to your app font */
      background: #222; /* dark background to match app */
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 40px;
      font-size: 2rem;
    }
    .menu-btn {
      margin: 15px;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: #28a745; /* green accent, change to your theme */
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }
    .menu-btn:hover {
      background: #1e7e34;
    }
  </style>
</head>
<body>
  <h1>Main Menu</h1>
  <a href="/gamesetup.html" class="menu-btn">Host Player</a>
<a href="/player" class="menu-btn">Player</a>
</body>
</html>
