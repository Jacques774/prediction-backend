<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Menu | Sport Volt</title>
  <link rel="stylesheet" href="styles.css"> <!-- optional external CSS -->
  <style>
    :root {
      --bg-primary: #050b14;       /* Deep midnight stadium background from Wix */
      --bg-card: #0d1726;          /* Slightly lighter navy for containers */
      --text-main: #ffffff;        /* Crisp white typography */
      --text-muted: #94a3b8;       /* Muted grey for labels */
      --accent-blue: #00d2ff;      /* Electric cyan glow accent */
      --border-color: #1e293b;     /* Dark subtle borders */
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    /* Temp Add Credit Button Style */
    .temp-add-btn {
      background: transparent;
      color: var(--accent-blue);
      border: 1px dashed var(--accent-blue);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .temp-add-btn:hover {
      background: rgba(0, 210, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }

    /* Temp Credit Box - Styled like your Wix product cards */
    .credit-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 32px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .credit-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .credit-amount {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 1px;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Matching your website's pill-shaped neon buttons */
    .menu-btn {
      margin: 10px;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
      background: transparent;
      border: 1px solid var(--accent-blue);
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      width: 200px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .menu-btn:hover {
      background-color: var(--accent-blue);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
    }
  </style>
</head>
<body>

  <!-- 🔑 Temp Add £5 Credit Button -->
  <button id="add-credit-btn" class="temp-add-btn">+ Add £5 Credit (Temp)</button>

  <!-- Temporary Credit Display -->
  <div class="credit-box">
    <div class="credit-label">Available Credit</div>
    <div class="credit-amount" id="user-credit">£30.00</div>
  </div>

  <h1>Main Menu</h1>
  <a href="/gamesetup.html" id="host-btn" class="menu-btn">Host Player</a>
  <a href="/player" class="menu-btn">Player</a>

  <script>
    // 🔑 FIX: Explicitly check for null so £0.00 isn't bypassed by short-circuit fallback
    const storedCredit = localStorage.getItem("user_credit");
    let userCredit = storedCredit !== null ? Number(storedCredit) : 30.00;

    // Save initial default credit if it's the user's first time visiting
    if (storedCredit === null) {
      localStorage.setItem("user_credit", userCredit.toFixed(2));
    }
    
    // Update credit display element
    const creditEl = document.getElementById("user-credit");
    if (creditEl) {
      creditEl.textContent = "£" + userCredit.toFixed(2);
    }

    // 🔑 Dynamically update Host link to pass credit parameter to gamesetup.html
    const hostBtn = document.getElementById("host-btn");
    if (hostBtn) {
      hostBtn.href = `/gamesetup.html?credit=${userCredit.toFixed(2)}`;
    }

    // 🔑 Temp Button Event Listener to add £5
    const addCreditBtn = document.getElementById("add-credit-btn");
    if (addCreditBtn) {
      addCreditBtn.addEventListener("click", () => {
        userCredit += 5.00;
        localStorage.setItem("user_credit", userCredit.toFixed(2));

        if (creditEl) {
          creditEl.textContent = "£" + userCredit.toFixed(2);
        }

        if (hostBtn) {
          hostBtn.href = `/gamesetup.html?credit=${userCredit.toFixed(2)}`;
        }

        console.log(`💰 Temp added £5. New credit: £${userCredit.toFixed(2)}`);
      });
    }
  </script>
</body>
</html>
