<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Menu</title>
  <link rel="stylesheet" href="styles.css"> <!-- optional external CSS -->
  <style>
    body {
      font-family: "Segoe UI", sans-serif; /* swap to your app font */
      background: #222; /* dark background to match app */
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    /* Temp Add Credit Button Style */
    .temp-add-btn {
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      transition: background 0.3s;
    }
    .temp-add-btn:hover {
      background: #0056b3;
    }

    /* Temp Credit Box */
    .credit-box {
      background: #2a2a2a;
      border: 2px solid #28a745;
      border-radius: 12px;
      padding: 12px 24px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .credit-label {
      font-size: 0.85rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .credit-amount {
      font-size: 1.8rem;
      font-weight: bold;
      color: #28a745;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2rem;
    }
    .menu-btn {
      margin: 10px;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: #28a745; /* green accent, change to your theme */
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
      width: 180px;
      text-align: center;
    }
    .menu-btn:hover {
      background: #1e7e34;
    }
  </style>
</head>
<body>

  <!-- 🔑 Temp Add £5 Credit Button -->
  <button id="add-credit-btn" class="temp-add-btn">+ Add £5 Credit (Temp)</button>

  <!-- Temporary Credit Display -->
  <div class="credit-box">
    <div class="credit-label">Available Credit</div>
    <div class="credit-amount" id="user-credit">£30.00</div>
  </div>

  <h1>Main Menu</h1>
  <a href="/gamesetup.html" id="host-btn" class="menu-btn">Host Player</a>
  <a href="/player" class="menu-btn">Player</a>

  <script>
    // 🔑 Retrieve credit from localStorage, defaulting to 30.00 if it's the first time
    let userCredit = Number(localStorage.getItem("user_credit") || 30.00);
    
    // Update credit display
    const creditEl = document.getElementById("user-credit");
    if (creditEl) {
      creditEl.textContent = "£" + userCredit.toFixed(2);
    }

    // 🔑 Dynamically update Host link to pass credit parameter to gamesetup.html
    const hostBtn = document.getElementById("host-btn");
    if (hostBtn) {
      hostBtn.href = `/gamesetup.html?credit=${userCredit}`;
    }

    // 🔑 Temp Button Event Listener to add £5
    const addCreditBtn = document.getElementById("add-credit-btn");
    if (addCreditBtn) {
      addCreditBtn.addEventListener("click", () => {
        userCredit += 5.00;
        localStorage.setItem("user_credit", userCredit.toFixed(2));

        if (creditEl) {
          creditEl.textContent = "£" + userCredit.toFixed(2);
        }

        if (hostBtn) {
          hostBtn.href = `/gamesetup.html?credit=${userCredit}`;
        }

        console.log(`💰 Temp added £5. New credit: £${userCredit.toFixed(2)}`);
      });
    }
  </script>
</body>
</html>
