<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Night</title>
  <link rel="stylesheet" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0b1220;
  color: #e5e7eb;
  margin: 0;
}

.screen {
  display: none;
}

/* ============================
   MAIN MENU
============================= */

.main-menu {
  position: fixed;
  inset: 0;
  background: #0b1220;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.funds-bar {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid #374151;
  font-size: 1rem;
  font-weight: 600;
}

.menu-content {
  background: #111827;
  padding: 30px;
  border-radius: 16px;
  border: 1px solid #1f2937;
  width: 100%;
  max-width: 420px;
  text-align: center;
}

.menu-title {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 24px;
}

.menu-btn {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #1f2937;
  color: #e5e7eb;
  border: 1px solid #374151;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
}

.menu-btn:hover {
  background: #374151;
}


/* ============================
   JOIN POPUP
============================= */

.join-popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
}

.join-popup-content {
  background: #111827;
  padding: 24px;
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  border: 1px solid #1f2937;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
}

.join-title {
  text-align: center;
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 10px;
}

.join-popup-content input {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #374151;
  background: #0f172a;
  color: #e5e7eb;
}

.primary-btn {
  padding: 12px;
  border-radius: 10px;
  background: #22c55e;
  color: #052e16;
  font-weight: 700;
  cursor: pointer;
  border: none;
}

.primary-btn:hover {
  background: #16a34a;
}


/* ============================
   CLOSE BUTTON
============================= */

.close-btn {
  position: absolute;
  top: 12px;
  right: 16px;
  background: #1f2937;
  border: none;
  color: #e5e7eb;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}


/* ============================
   PLAYER / HOST SLIDES
============================= */

.player-details-slide {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
}

.details-content {
  background: #111827;
  border-radius: 14px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  border: 1px solid #1f2937;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
}

.details-content input {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: #0f172a;
  color: #e5e7eb;
}

.readonly-field {
  padding: 10px 12px;
  border-radius: 10px;
  background: #1f2937;
  border: 1px solid #374151;
}


/* ============================
   DASHBOARD
============================= */

.dashboard {
  position: fixed;
  inset: 0;
  background: #0b1220;
  padding: 16px;
}

.dashboard-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.dash-btn {
  background: #1f2937;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #374151;
  cursor: pointer;
}

.question-card {
  background: #111827;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid #1f2937;
}

.stake-row {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.stake-btn {
  background: #374151;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
}


/* ============================
   STAKE POPUP
============================= */

.stake-popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
}

.stake-popup-content {
  background: #1f2937;
  padding: 20px;
  border-radius: 10px;
  width: 260px;
  text-align: center;
}


/* ============================
   LEADERBOARD
============================= */

.leaderboard-panel {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: flex-end;
}

.leaderboard-content {
  background: #0f172a;
  width: 100%;
  max-height: 80%;
  border-radius: 18px 18px 0 0;
  padding: 20px;
  overflow-y: auto;
}


/* ============================
   HISTORY
============================= */

.history-panel {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: flex-end;
}

.history-content {
  background: #0f172a;
  width: 100%;
  max-height: 80%;
  border-radius: 18px 18px 0 0;
  padding: 20px;
  overflow-y: auto;
}
  
</style>
  
<body>

  <!-- ============================
       MAIN MENU
  ============================= -->
  <div id="mainMenu" class="screen main-menu">

    <div class="funds-bar">
      Credits: <span id="userFunds">0</span>
    </div>

    <div class="menu-content">
      <h1 class="menu-title">Game Night</h1>

      <button id="btn-player" class="menu-btn">Player</button>
      <button id="btn-host" class="menu-btn">Host Player</button>
    </div>

  </div>


  <!-- ============================
       PLAYER JOIN POPUP
  ============================= -->
  <div id="playerJoinPopup" class="screen join-popup">
    <div class="join-popup-content">

      <button class="close-btn" onclick="closePlayerJoinPopup()">Close</button>

      <h2 class="join-title">Join Game Night</h2>

      <label>Join Code</label>
      <input id="joinCodeInput" type="text" placeholder="ABC123">

      <label>Join Link</label>
      <input id="joinLinkInput" type="text" placeholder="https://gamenight.app/join/ABC123">

      <button class="primary-btn" onclick="joinGameNight()">Join</button>

    </div>
  </div>


  <!-- ============================
       PLAYER DETAILS SLIDE
  ============================= -->
  <div id="playerDetailsSlide" class="screen player-details-slide">
    <div class="details-content">
      <button class="close-btn" onclick="closePlayerDetails()">Close</button>

      <h2>Player Details</h2>

      <label>Name</label>
      <input id="playerNameInput" type="text" placeholder="Enter your name">

      <label>Starting Funds</label>
      <div class="readonly-field" id="playerStartingFunds">0</div>

      <button class="primary-btn" onclick="playerReady()">Continue</button>
    </div>
  </div>


  <!-- ============================
       HOST SETUP SLIDE
  ============================= -->
  <div id="hostSetupSlide" class="screen player-details-slide">
    <div class="details-content">
      <button class="close-btn" onclick="closeHostSetup()">Close</button>

      <h2>Host Setup</h2>

      <label>Sport</label>
      <input id="hostSportInput" type="text" placeholder="Football, UFC, etc">

      <label>Starting Funds</label>
      <input id="hostStartingFundsInput" type="number" value="100">

      <button class="primary-btn" onclick="hostReady()">Create Game Night</button>
    </div>
  </div>


  <!-- ============================
       GAME DASHBOARD
  ============================= -->
  <div id="gameDashboard" class="screen dashboard">

    <div class="dashboard-header">
      <h2 id="dashboardTitle">Game Night</h2>

      <div class="dashboard-buttons">
        <button class="dash-btn" onclick="openLeaderboard()">Leaderboard</button>
        <button class="dash-btn" onclick="openHistory()">History</button>
      </div>
    </div>

    <div id="questionCard" class="question-card">
      <h3 id="questionText">Waiting for host...</h3>

      <div class="stake-row">
        <button class="stake-btn" onclick="openStakePopup()">Stake</button>
        <div class="funds-display">Funds: <span id="currentFunds">0</span></div>
      </div>
    </div>

  </div>


  <!-- ============================
       STAKE POPUP
  ============================= -->
  <div id="stakePopup" class="screen stake-popup">
    <div class="stake-popup-content">
      <h3>Enter Stake</h3>
      <input id="stake-popup-input" type="number" placeholder="Amount">

      <button id="stake-save-btn" onclick="saveStake()">Save</button>
      <button id="stake-cancel-btn" onclick="closeStakePopup()">Cancel</button>
    </div>
  </div>


  <!-- ============================
       LEADERBOARD PANEL
  ============================= -->
  <div id="leaderboardPanel" class="screen leaderboard-panel">
    <div class="leaderboard-content">
      <button class="close-btn" onclick="closeLeaderboard()">Close</button>

      <h2 class="leaderboard-title">Leaderboard</h2>
      <div class="leaderboard-list" id="leaderboardList"></div>
    </div>
  </div>


  <!-- ============================
       HISTORY PANEL
  ============================= -->
  <div id="historyPanel" class="screen history-panel">
    <div class="history-content">
      <button class="close-btn" onclick="closeHistory()">Close</button>

      <h2 class="history-header">History</h2>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
// State
let playerFunds = Number(localStorage.getItem("playerFunds")) || 200;
let currentFunds = 0;
let isHost = false;

// Init
updateFundsDisplay();
showScreen("mainMenu");

// Screen switching
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.style.display = "none");
  document.getElementById(id).style.display = "flex";
}

// Update funds bar
function updateFundsDisplay() {
  document.getElementById("userFunds").textContent = playerFunds;
}

/* ============================
   MAIN MENU BUTTONS
============================= */

document.getElementById("btn-player").onclick = () => {
  showScreen("playerJoinPopup");
};

document.getElementById("btn-host").onclick = () => {
  isHost = true;
  showScreen("hostSetupSlide");
};


/* ============================
   PLAYER JOIN POPUP
============================= */

function closePlayerJoinPopup() {
  showScreen("mainMenu");
}

function joinGameNight() {
  const code = document.getElementById("joinCodeInput").value.trim();
  const link = document.getElementById("joinLinkInput").value.trim();

  if (!code && !link) {
    alert("Enter a join code or link");
    return;
  }

  let gameCode = code;
  if (!gameCode && link.includes("/join/")) {
    gameCode = link.split("/join/")[1];
  }

  if (!gameCode) {
    alert("Invalid link or code");
    return;
  }

  localStorage.setItem("currentGameCode", gameCode);

  showScreen("playerDetailsSlide");
}


/* ============================
   PLAYER DETAILS
============================= */

function closePlayerDetails() {
  showScreen("mainMenu");
}

function playerReady() {
  const name = document.getElementById("playerNameInput").value.trim();
  if (!name) {
    alert("Enter your name");
    return;
  }

  const starting = 100;

  if (playerFunds < starting) {
    alert("Not enough credits (need 100)");
    return;
  }

  playerFunds -= starting;
  currentFunds = starting;
  localStorage.setItem("playerFunds", playerFunds);
  updateFundsDisplay();

  showScreen("gameDashboard");
  document.getElementById("dashboardTitle").textContent = `Player: ${name}`;
  document.getElementById("currentFunds").textContent = currentFunds;
}


/* ============================
   HOST SETUP
============================= */

function closeHostSetup() {
  showScreen("mainMenu");
}

function hostReady() {
  const sport = document.getElementById("hostSportInput").value.trim();

  currentFunds = 0;

  showScreen("gameDashboard");
  document.getElementById("dashboardTitle").textContent = `Host (${sport || "Game Night"})`;
  document.getElementById("currentFunds").textContent = currentFunds;
}


/* ============================
   STAKE POPUP
============================= */

function openStakePopup() {
  if (isHost) {
    alert("Host plays free.");
    return;
  }
  showScreen("stakePopup");
}

function closeStakePopup() {
  showScreen("gameDashboard");
}

function saveStake() {
  const stake = Number(document.getElementById("stake-popup-input").value);

  if (!stake || stake <= 0) {
    alert("Enter a valid stake");
    return;
  }

  if (stake > currentFunds) {
    alert("Not enough funds");
    return;
  }

  currentFunds -= stake;
  document.getElementById("currentFunds").textContent = currentFunds;

  document.getElementById("stake-popup-input").value = "";
  closeStakePopup();
}


/* ============================
   LEADERBOARD
============================= */

function openLeaderboard() {
  showScreen("leaderboardPanel");

  const list = document.getElementById("leaderboardList");
  list.innerHTML = "";

  const demo = [
    { rank: 1, name: "Alice", balance: 320 },
    { rank: 2, name: "Bob", balance: 250 },
    { rank: 3, name: "You", balance: currentFunds }
  ];

  demo.forEach(item => {
    const div = document.createElement("div");
    div.className = "leaderboard-item";

    div.innerHTML = `
      <div class="left">
        <div class="rank">${item.rank}</div>
        <div class="name">${item.name}</div>
      </div>
      <div class="balance">${item.balance}</div>
    `;
    list.appendChild(div);
  });
}

function closeLeaderboard() {
  showScreen("gameDashboard");
}


/* ============================
   HISTORY
============================= */

function openHistory() {
  showScreen("historyPanel");

  const list = document.getElementById("historyList");
  list.innerHTML = "";

  const demo = [
    { question: "Will Team A win?", outcome: "YES", profit: +40 },
    { question: "Over 2.5 goals?", outcome: "NO", profit: -20 }
  ];

  demo.forEach(item => {
    const card = document.createElement("div");
    card.className = "history-card";

    card.innerHTML = `
      <div class="history-question">${item.question}</div>
      <div class="history-outcome-text">Outcome: ${item.outcome}</div>
      <div class="history-balance">Profit: ${item.profit}</div>
    `;
    list.appendChild(card);
  });
}

function closeHistory() {
  showScreen("gameDashboard");
}
    
  </script>
</body>
</html>
