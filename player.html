<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Game - Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PLAYER SETUP SLIDE -->
<div id="playerSetupSlide" class="player-details-slide">
  <div class="details-content">
    <h2>Join Game</h2>

    <label>Your Name</label>
    <input type="text" id="player-name-input" placeholder="Enter your name">

    <label>Game Code</label>
    <input type="text" id="game-code-input" placeholder="Enter game code">

    <div id="playerNameError" class="error-text" style="display:none;">
      Name and code required
    </div>

    <button id="player-join-btn">Join Game</button>
  </div>
</div>

<!-- GAME DASHBOARD -->
<div class="dashboard hidden" id="dashboard">
  <div class="top-header">
    <div class="header-left">
      <div class="header-line" id="player-name">Player: --</div>
      <div class="header-line" id="player-balance">Balance: 120</div>
    </div>
    <div class="header-right">
      <div class="header-line" id="player-wins">Wins: 0</div>
      <div class="header-line" id="player-cashouts">Cash-outs: 0</div>
    </div>
  </div>

  <!-- Countdown -->
  <div id="preCountdown" style="display:none;">3</div>
  <div id="postQuestionCountdown" style="display:none;">3</div>

  <!-- Prediction Card -->
  <div class="cards">
    <div class="card" id="active-card">
      <div class="card-header">
        <div class="question-text" id="q-text">Waiting for host...</div>
      </div>
      <div class="choices">
        <button class="btn btn-yes" onclick="sendPrediction('YES')">YES</button>
        <button class="btn btn-no" onclick="sendPrediction('NO')">NO</button>
      </div>

      <div class="cashout-row">
        <span class="position" id="q-info">
          You chose: --<br>
          Stake: --<br>
          Timer: --
        </span>
        <div class="cashout-action">
          <input type="number" id="cashout-amount" placeholder="Amount" />
          <button id="cashout-btn" class="cashout-btn" onclick="cashout()">Cash Out</button>
          <div class="cashout-timer" id="timer">Cash out: --s</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Buttons -->
  <div class="bottom-buttons">
    <button class="nav-btn" onclick="openHistory()">History</button>
    <button class="nav-btn" onclick="openLeaderboard()">Leaderboard</button>
  </div>

  <!-- Panels -->
  <div id="historyPanel" class="history-panel">
    <div class="history-content">
      <button class="close-btn" onclick="closeHistory()">Close</button>
      <div class="history-header">History</div>
      <div class="history-list"></div>
    </div>
  </div>

  <div id="leaderboardPanel">
    <div class="leaderboard-content">
      <button class="close-btn" onclick="closeLeaderboard()">Close</button>
      <div class="leaderboard-title">Leaderboard</div>
      <div id="leaderboard-list" class="leaderboard-list"></div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="socket.js"></script>
<script src="engine.js"></script>
<script src="leaderboard.js"></script>
<script src="history.js"></script>
<script src="player-ui.js"></script>

</body>
</html>
